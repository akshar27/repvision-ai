name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 ffmpeg
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
      # The browser engine reads thresholds/fixtures exported from the Python rules; fail if they drifted.
      - name: Shared rules/fixtures are up to date
        run: |
          python scripts/export_shared.py
          git diff --exit-code -- frontend/lib/generated frontend/tests/fixtures

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next typegen   # generates the global LayoutProps/PageProps types
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
